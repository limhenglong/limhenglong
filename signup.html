<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-900 via-indigo-900 to-blue-800 min-h-screen flex items-center justify-center p-4">

    <div class="glass w-full max-w-md p-8 rounded-2xl shadow-2xl text-white">
        <h2 class="text-3xl font-bold mb-2 text-center">Join Us</h2>
        <p class="text-indigo-200 text-center mb-8">Create your secure account</p>

        <div id="msg-box" class="hidden p-3 rounded-lg mb-6 text-sm text-center"></div>

        <div class="space-y-6">
            <div>
                <label class="block text-sm font-medium mb-2">Email Address</label>
                <input type="email" id="email" required
                    class="w-full bg-white/10 border border-white/20 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-purple-400 transition-all"
                    placeholder="email@example.com">
            </div>

            <div>
                <label class="block text-sm font-medium mb-2">Password</label>
                <input type="password" id="password" required
                    class="w-full bg-white/10 border border-white/20 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-purple-400 transition-all"
                    placeholder="••••••••">
            </div>

            <button onclick="handleSignUp()" 
                class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 rounded-lg shadow-lg transform transition active:scale-95">
                Register
            </button>
        </div>

        <p class="mt-8 text-center text-sm text-indigo-200">
            Already have an account? <a href="index.html" class="text-white font-semibold hover:underline">Login</a>
        </p>
    </div>

    <script>
        // Use the same keys as your index.html
        const supabaseUrl = 'https://fcknhzquxuowmddmjzui.supabase.co';
        const supabaseKey = 'sb_publishable_roUXdOqVVjjD40XrQJcDwA_JTHOq_Jp';
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        async function handleSignUp() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            const msgBox = document.getElementById('msg-box');

            const { data, error } = await supabase.auth.signUp({
                email: email,
                password: pass,
            });

            if (error) {
                msgBox.innerText = error.message;
                msgBox.className = "bg-red-500/20 border border-red-500 text-red-100 p-3 rounded-lg mb-6 text-sm text-center";
                msgBox.classList.remove('hidden');
            } else {
                msgBox.innerText = "Check your email for a confirmation link!";
                msgBox.className = "bg-green-500/20 border border-green-500 text-green-100 p-3 rounded-lg mb-6 text-sm text-center";
                msgBox.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
