<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-900 via-purple-900 to-pink-800 min-h-screen flex items-center justify-center p-4">

    <div class="glass w-full max-w-md p-8 rounded-2xl shadow-2xl text-white">
        <h2 class="text-3xl font-bold mb-2 text-center">Welcome Back</h2>
        <p class="text-indigo-200 text-center mb-8">Login to your secure dashboard</p>

        <div id="error-box" class="hidden bg-red-500/20 border border-red-500 text-red-100 p-3 rounded-lg mb-6 text-sm text-center"></div>

        <div class="space-y-6">
            <div>
                <label class="block text-sm font-medium mb-2">Email Address</label>
                <input type="email" id="email" required
                    class="w-full bg-white/10 border border-white/20 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-400 transition-all placeholder-indigo-300"
                    placeholder="name@email.com">
            </div>

            <div>
                <label class="block text-sm font-medium mb-2">Password</label>
                <input type="password" id="password" required
                    class="w-full bg-white/10 border border-white/20 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-400 transition-all placeholder-indigo-300"
                    placeholder="••••••••">
            </div>

            <button onclick="handleLogin()" 
                class="w-full bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-3 rounded-lg shadow-lg transform transition active:scale-95">
                Sign In
            </button>
        </div>

        <p class="mt-8 text-center text-sm text-indigo-200">
            Don't have an account? <a href="signup.html" class="text-white font-semibold hover:underline">Sign up for free</a>
        </p>
    </div>

    <script>
        // REPLACE THESE WITH YOUR ACTUAL SUPABASE PROJECT DETAILS
        const supabaseUrl = 'https://fcknhzquxuowmddmjzui.supabase.co';
        const supabaseKey = 'sb_publishable_roUXdOqVVjjD40XrQJcDwA_JTHOq_Jp';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorBox = document.getElementById('error-box');

            // Sign in attempt using Supabase Auth
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                errorBox.innerText = error.message;
                errorBox.classList.remove('hidden');
            } else {
                // On success, go to dashboard
                window.location.href = "dashboard.html";
            }
        }
    </script>
</body>
</html>
