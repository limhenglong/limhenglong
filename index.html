<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern GitHub Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-blue-900 to-black min-h-screen flex items-center justify-center p-4">

    <div class="glass w-full max-w-md p-8 rounded-2xl shadow-2xl text-white">
        <h2 class="text-3xl font-bold mb-2 text-center">GitHub Hosted</h2>
        <p class="text-blue-200 text-center mb-8">Enter credentials to enter</p>

        <div id="error-box" class="hidden bg-red-500/20 border border-red-500 text-red-100 p-3 rounded-lg mb-6 text-sm text-center">
            Invalid username or password.
        </div>

        <div class="space-y-6">
            <div>
                <label class="block text-sm font-medium mb-2">Username</label>
                <input type="text" id="username" 
                    class="w-full bg-white/10 border border-white/20 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-400 transition-all placeholder-blue-300"
                    placeholder="admin">
            </div>

            <div>
                <label class="block text-sm font-medium mb-2">Password</label>
                <input type="password" id="password" 
                    class="w-full bg-white/10 border border-white/20 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-400 transition-all placeholder-blue-300"
                    placeholder="••••••••">
            </div>

            <button onclick="handleLogin()" 
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg shadow-lg transform transition active:scale-95">
                Sign In
            </button>
        </div>
    </div>

    <script>
        function handleLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorBox = document.getElementById('error-box');

            // This replaces the Python 'if' logic
            if (user === "admin" && pass === "1234") {
                alert("Login Successful! Redirecting...");
                window.location.href = "https://github.com"; // Redirect to any page
            } else {
                errorBox.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
